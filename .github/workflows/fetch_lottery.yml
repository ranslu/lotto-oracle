name: Fetch Lottery Data & Email Picks

on:
  schedule:
    - cron: '30 4 * * *'   # Daily at 4:30 AM UTC (10:30 PM Mountain)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch last 24h lottery draws
        run: python fetch_lottery.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: auto-update lottery data [skip ci]"
          file_pattern: lottery_data.json

      - name: Email daily picks
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
        run: python email_picks.py
