name: Fetch Lottery Data

on:
  schedule:
    - cron: '0 4 * * *'   # Daily at 4 AM UTC (10 PM Mountain) — catches all draw nights
  workflow_dispatch:        # Allow manual trigger from GitHub

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch lottery data
        run: python fetch_lottery.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update lottery data [skip ci]"
          file_pattern: lottery_data.json
