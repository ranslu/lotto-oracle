name: Fetch Lottery Data & Email Picks

on:
  schedule:
    - cron: '30 4 * * *'   # Daily at 4:30 AM UTC (10:30 PM Mountain)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch last 24h lottery draws
        run: python fetch_lottery.py

      - name: Build morning brief (docs/brief.html)
        continue-on-error: true   # a brief problem must never block the email
        run: python generate_brief.py

      - name: Commit updated data and brief
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: auto-update lottery data and brief [skip ci]"
          file_pattern: lottery_data.json docs/brief.html

      - name: Email daily picks
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
        run: python email_picks.py
